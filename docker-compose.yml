services:
  # --- Infrastructure ---
  mongodb:
    image: mongo:latest
    container_name: factorio-db
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - db-network
      - app-network

  mongo-express:
    image: mongo-express:latest
    container_name: factorio-db-ui
    depends_on:
      - mongodb
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin 
    networks:
      - db-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - app-network
    
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin # Parola default
    networks:
      - app-network
    volumes:
      - grafana-storage:/var/lib/grafana

  # --- Microservices ---

  auth-service:
    build: ./auth-service
    container_name: factorio-auth
    depends_on:
      - mongodb
    environment:
      - MONGO_DETAILS=mongodb://mongodb:27017
    networks:
      - gateway-network
      - db-network
      - app-network

  persistence-bridge:
    build: ./persistence-bridge
    container_name: persistence-bridge
    depends_on:
      - mongodb
      - validator-service
    environment:
      - MONGO_URI=mongodb://mongodb:27017/blueprints_db
      - VALIDATOR_URL=http://validator-service:3000/validate
    networks:
      - internal-network
      - db-network
      - app-network

  validator-service:
    build: ./validator-service
    container_name: validator-service
    networks:
      - internal-network
      - app-network

  logic-service:
    build: ./blueprint-logic
    container_name: logic-service
    depends_on:
      - persistence-bridge
    networks:
      - gateway-network
      - internal-network
      - app-network

  mongodb-exporter:
    image: percona/mongodb_exporter:0.40
    container_name: mongodb-exporter
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
    ports:
      - "9216:9216"
    networks:
      - app-network
      - db-network

  # --- Gateway & Management ---

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: always
    security_opt:
      - no-new-privileges:true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    ports:
      - "9443:9443"
      - "9000:9000"
    networks:
      - gateway-network
  kong-db:
    image: postgres:13
    container_name: kong-db
    environment:
      POSTGRES_USER: kong
      POSTGRES_DB: kong
      POSTGRES_PASSWORD: kong
    volumes:
      - kong_data:/var/lib/postgresql/data
    networks:
      - db-network

  kong-migrations:
      image: kong:latest
      command: kong migrations bootstrap
      depends_on:
        - kong-db
      environment:
        KONG_DATABASE: postgres
        KONG_PG_HOST: kong-db
        KONG_PG_PASSWORD: kong
      networks:
        - db-network

  kong:
      image: kong:latest
      container_name: kong-gateway
      depends_on:
        - kong-db
        - kong-migrations # Wait for migrations to finish
      environment:
        KONG_DATABASE: postgres
        KONG_PG_HOST: kong-db
        KONG_PG_USER: kong
        KONG_PG_PASSWORD: kong
        KONG_PROXY_LISTEN: 0.0.0.0:8000
        KONG_ADMIN_LISTEN: 0.0.0.0:8001
      ports:
        - "8000:8000" # Traffic
        - "8001:8001" # Admin API
      networks:
        - gateway-network
        - db-network

networks:
  app-network:
    driver: bridge
  gateway-network:
    driver: bridge
  internal-network:
    driver: bridge
  db-network:
    driver: bridge

volumes:
  kong_data:
  mongo-data:
  prometheus-data:
  grafana-storage:
  portainer_data: