stages:
  - test
  - build

test_auth:
  stage: test
  image: python:3.10-slim
  services:
    - name: mongo:latest
      alias: mongodb
  variables:
    MONGO_DETAILS: "mongodb://mongodb:27017"
  only:
    changes:
      - auth-service/**/*
  script:
    - cd auth-service
    - pip install --no-cache-dir -r requirements.txt
    # This is the line that needs changing:
    - python3 -m pytest tests/test_auth.py

build_auth:
  stage: build
  image: docker:24.0
  services:
    - name: docker:24.0-dind
      alias: docker # Important pentru runner-ele care folosesc TLS
  variables:
    DOCKER_TLS_CERTDIR: "" # Dezactivăm TLS dacă runner-ul Grid nu e configurat special
  only:
    changes:
      - auth-service/**/*
  script:
    - cd auth-service
    - docker build -t factorio-auth-service:$CI_COMMIT_SHORT_SHA .