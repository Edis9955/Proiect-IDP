stages:
  - test
  - build
  - deploy

# AUTH tests
test_auth:
  stage: test
  image: python:3.10-slim
  services:
    - name: mongo:latest
      alias: mongodb
  variables:
    MONGO_DETAILS: "mongodb://mongodb:27017"
  only:
    changes:
      - auth-service/**/*
  script:
    - cd auth-service
    - pip install --no-cache-dir -r requirements.txt
    - python3 -m pytest tests/test_auth.py

# BLUEPRINT-LOGIC tests
test_blueprint-logic:
  stage: test
  image: node:18-slim
  only:
    changes:
      - blueprint-logic/**/*
  script:
    - cd blueprint-logic
    - npm install
    - npx jest --passWithNoTests

# PERSISTANCE-BRIDGE tests
test_persistance-bridge:
  stage: test
  image: node:18-slim
  services:
    - name: mongo:latest
      alias: mongodb
  variables:
    MONGO_URI: "mongodb://mongodb:27017/bridge_test_db"
  only:
    changes:
      - persistence-bridge/**/*
  script:
    - cd persistence-bridge
    - npm install
    - npx jest --passWithNoTests

# VALIDATOR-SERVICE tests
test_validator:
  stage: test
  image: node:18-slim
  only:
    changes:
      - validator-service/**/*
  script:
    - cd validator-service
    - npm install
    - npx jest --passWithNoTests --forceExit

# AUTH build
build_auth:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  only:
    changes:
      - auth-service/**/*
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(printf "%s:%s" "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    - |
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}/auth-service" \
        --dockerfile "${CI_PROJECT_DIR}/auth-service/Dockerfile" \
        --destination "${CI_REGISTRY_IMAGE}/factorio-auth-service:$CI_COMMIT_SHORT_SHA" \
        --destination "${CI_REGISTRY_IMAGE}/factorio-auth-service:latest"

# BLUEPRINT-LOGIC build
build_blueprint-logic:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  only:
    changes:
      - blueprint-logic/**/*
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(printf "%s:%s" "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    - |
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}/blueprint-logic" \
        --dockerfile "${CI_PROJECT_DIR}/blueprint-logic/Dockerfile" \
        --destination "${CI_REGISTRY_IMAGE}/factorio-logic-service:$CI_COMMIT_SHORT_SHA" \
        --destination "${CI_REGISTRY_IMAGE}/factorio-logic-service:latest"

# PERSISTANCE-BRIDGE build
build_persistance-bridge:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  only:
