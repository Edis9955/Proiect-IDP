        --destination "${CI_REGISTRY_IMAGE}/validator-service:$CI_COMMIT_SHORT_SHA" \
        --destination "${CI_REGISTRY_IMAGE}/validator-service:latest"

.deploy_template: &deploy_template
  stage: deploy
  image: alpine:latest
  tags:
    - local-deploy
  before_script:
    - if [ ! -x "$(command -v docker)" ]; then apk update && apk add --no-cache docker-cli; fi
    - docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}

# DEPLOY AUTH-SERVICE
deploy_auth:
  <<: *deploy_template
  only:
    changes:
      - auth-service/**/*
    refs:
      - main
  script:
    - docker pull ${CI_REGISTRY_IMAGE}/factorio-auth-service:$CI_COMMIT_SHORT_SHA
        - docker stop auth-service || true
        - docker rm auth-service || true
        - docker run -d --name auth-service -p 3000:3000 ${CI_REGISTRY_IMAGE}/factorio-auth-service:$CI_COMMIT_SHORT_SHA

# DEPLOY BLUEPRINT-LOGIC
deploy_blueprint-logic:
  <<: *deploy_template
  only:
    changes:
      - blueprint-logic/**/*
    refs:
      - main
  script:
    - docker pull ${CI_REGISTRY_IMAGE}/blueprint-logic:$CI_COMMIT_SHORT_SHA
        - docker stop blueprint-logic || true
        - docker rm blueprint-logic || true
        - docker run -d --name blueprint-logic -p 3001:3000 ${CI_REGISTRY_IMAGE}/blueprint-logic:$CI_COMMIT_SHORT_SHA

# DEPLOY PERSISTANCE-BRIDGE
deploy_persistance-bridge:
