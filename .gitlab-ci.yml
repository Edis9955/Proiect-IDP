        - docker stop persistence-bridge || true
        - docker rm persistence-bridge || true
        - docker run -d --name persistence-bridge -p 3002:3000 ${CI_REGISTRY_IMAGE}/persistence-bridge:$CI_COMMIT_SHORT_SHA

# DEPLOY VALIDATOR-SERVICE
deploy_validator:
