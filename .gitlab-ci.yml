  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: [persistence-bridge/**/*]
  script:
    - |
      ssh levent@172.17.247.64 "
        docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY} &&
        docker pull ${CI_REGISTRY_IMAGE}/persistence-bridge:$CI_COMMIT_SHORT_SHA &&
        docker stop persistence-bridge || true &&
        docker rm persistence-bridge || true &&
        docker run -d --name persistence-bridge -p 3002:3000 ${CI_REGISTRY_IMAGE}/persistence-bridge:$CI_COMMIT_SHORT_SHA
      "

deploy_validator:
  extends: .deploy_template
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: [validator-service/**/*]
  script:
    - |
      ssh levent@172.17.247.64 "
        docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY} &&
        docker pull ${CI_REGISTRY_IMAGE}/validator-service:$CI_COMMIT_SHORT_SHA &&
        docker stop validator-service || true &&
        docker rm validator-service || true &&
        docker run -d --name validator-service -p 3003:3000 ${CI_REGISTRY_IMAGE}/validator-service:$CI_COMMIT_SHORT_SHA
      "