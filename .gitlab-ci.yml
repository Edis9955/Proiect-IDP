stages:
  - test
  - build

# AUTH tests
test_auth:
  stage: test
  image: python:3.10-slim
  services:
    - name: mongo:latest
      alias: mongodb
  variables:
    MONGO_DETAILS: "mongodb://mongodb:27017"
  only:
    changes:
      - auth-service/**/*
  script:
    - cd auth-service
    - pip install --no-cache-dir -r requirements.txt
    - python3 -m pytest tests/test_auth.py

# BLUEPRINT-LOGIC tests
test_blueprint-logic:
  stage: test
  image: node:18-slim
  only:
    changes:
      - blueprint-logic/**/*
  script:
    - cd blueprint-logic
    - npm install
    - npx jest --passWithNoTests

# Build Auth (Python) folosind Kaniko
build_auth:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  only:
    changes:
      - auth-service/**/*
  script:
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}/auth-service"
      --dockerfile "${CI_PROJECT_DIR}/auth-service/Dockerfile"
      --no-push  # Doar testează build-ul, nu trimite imaginea nicaieri
      --destination "factorio-auth-service:$CI_COMMIT_SHORT_SHA"

# Build Logic (Node.js) folosind Kaniko
build_logic:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  only:
    changes:
      - blueprint-logic/**/*
  script:
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}/blueprint-logic"
      --dockerfile "${CI_PROJECT_DIR}/blueprint-logic/Dockerfile"
      --no-push
      --destination "factorio-logic-service:$CI_COMMIT_SHORT_SHA"