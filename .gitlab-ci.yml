stages:
  - test
  - build

# AUTH tests
test_auth:
  stage: test
  image: python:3.10-slim
  services:
    - name: mongo:latest
      alias: mongodb
  variables:
    MONGO_DETAILS: "mongodb://mongodb:27017"
  only:
    changes:
      - auth-service/**/*
  script:
    - cd auth-service
    - pip install --no-cache-dir -r requirements.txt
    - python3 -m pytest tests/test_auth.py

# BLUEPRINT-LOGIC tests
test_blueprint-logic:
  stage: test
  image: node:18-slim
  only:
    changes:
      - blueprint-logic/**/*
  script:
    - cd blueprint-logic
    - npm install
    - npx jest --passWithNoTests

# PERSISTANCE-BRIDGE tests
test_bridge:
  stage: test
  image: node:18-slim
  services:
    - name: mongo:latest
      alias: mongodb
  variables:
    MONGO_URI: "mongodb://mongodb:27017/bridge_test_db"
  only:
    changes:
      - persistence-bridge/**/*
  script:
    - cd persistence-bridge
    - npm install
    - npx jest --passWithNoTests

# AUTH build
build_auth:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  only:
    changes:
      - auth-service/**/*
  script:
    - |
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}/auth-service" \
        --dockerfile "${CI_PROJECT_DIR}/auth-service/Dockerfile" \
        --no-push \
        --destination "factorio-auth-service:$CI_COMMIT_SHORT_SHA"

# BLUEPRINT-LOGIC build
build_blueprint-logic:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  only:
    changes:
      - blueprint-logic/**/*
  script:
    - |
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}/blueprint-logic" \
        --dockerfile "${CI_PROJECT_DIR}/blueprint-logic/Dockerfile" \
        --no-push \
        --destination "factorio-logic-service:$CI_COMMIT_SHORT_SHA"

# PERSISTANCE-BRIDGE build
build_persistance-bridge:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  only:
    changes:
      - persistence-bridge/**/*
  script:
    - |
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}/persistence-bridge" \
        --dockerfile "${CI_PROJECT_DIR}/persistence-bridge/Dockerfile" \
        --no-push \
        --destination "persistence-bridge:$CI_COMMIT_SHORT_SHA"